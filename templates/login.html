<!DOCTYPE html>
<html lang="en" class="mdui-theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTM Dashboard - Login</title>
  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgb(var(--mdui-color-surface));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 40px 36px 32px;
      background: rgb(var(--mdui-color-surface-container));
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    .login-icon { font-size: 48px; text-align: center; margin-bottom: 8px; }
    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: rgb(var(--mdui-color-on-surface));
      margin: 0 0 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13px;
      color: rgb(var(--mdui-color-on-surface-variant));
      margin-bottom: 32px;
    }
    .error-msg {
      background: rgba(var(--mdui-color-error), 0.15);
      color: rgb(var(--mdui-color-error));
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    mdui-text-field { width: 100%; margin-bottom: 24px; }
    mdui-button { width: 100%; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🎵</div>
    <h1>YTM Dashboard</h1>
    <p class="subtitle">Admin access only</p>

    {% if error %}
    <div class="error-msg">
      <mdui-icon name="error_outline"></mdui-icon>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <mdui-text-field
        type="password"
        name="password"
        label="Password"
        placeholder="Enter admin password"
        autofocus
        clearable
      ></mdui-text-field>
      <mdui-button type="submit" variant="filled">
        <mdui-icon slot="icon" name="login"></mdui-icon>
        Sign In
      </mdui-button>
    </form>
  </div>
</body>
</html>
